# =============================================================================
# DEVELOPMENT pipeline - deploys ONLY the dev stack, from the develop branch,
# using the dev artifact bucket and the dev OIDC deploy role.
# This is a hand-written replacement for the auto-generated multi-environment
# `sam pipeline init` workflow, which packed both stages into one file.
#
# Every step here is either an action or a one-line call into
# .github/scripts/. The logic lives in those scripts so it is reviewable,
# runnable locally, and shared with deploy-prod.yml instead of copied into it.
# =============================================================================
name: Deploy DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:

# Short-lived credentials via OpenID Connect - no AWS keys stored in GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  SAM_CONFIG_ENV: dev
  STACK_NAME: week7-orders-dev
  TABLE_NAME: week7-orders-dev

jobs:

  # ---------------------------------------------------------------------------
  validate:
    name: Lint and validate template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # Installs cfn-lint and lints template.yaml plus the bootstrap stacks.
      # The template list lives in the script, so adding one touches one file.
      - name: cfn-lint
        run: bash .github/scripts/lint-templates.sh

      - name: sam validate
        run: sam validate --template template.yaml --region "${{ vars.AWS_REGION }}"

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy dev stack
    needs: validate
    runs-on: ubuntu-latest
    environment: dev            # GitHub Environment holding the dev variables
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # Prints the OIDC subject GitHub is actually sending. The role's trust
      # policy must match this exact string. Not a credential - the token is
      # decoded locally and only the claim names are echoed.
      - name: Show OIDC subject claim
        continue-on-error: true      # diagnostic only - never fail the deploy
        run: python3 .github/scripts/debug-oidc-claims.py

      - name: Assume dev deployment role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-dev-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Exports TEMPLATE for the deploy step - the built template when there is
      # one, the source template when sam build has nothing to do.
      - name: SAM build
        run: bash .github/scripts/sam-build.sh

      - name: SAM deploy (dev)
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: dev
        run: bash .github/scripts/sam-deploy.sh

      # Checks On-Demand billing, the Standard-IA table class and the two GSIs
      # against the live table, and writes the result into the job summary.
      - name: Verify deployed table against the lab requirements
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT_LABEL: DEV
        run: bash .github/scripts/verify-table.sh
