# =============================================================================
# PRODUCTION pipeline - deploys ONLY the prod stack, from the main branch,
# using the prod artifact bucket and the prod OIDC deploy role.
# Separate file, separate role, separate bucket, separate GitHub Environment
# (which carries the required-reviewer approval gate).
#
# The steps call the same .github/scripts/ helpers as the dev pipeline, with
# different environment values - so prod cannot quietly diverge from what dev
# was tested with.
# =============================================================================
name: Deploy PROD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  SAM_CONFIG_ENV: prod
  STACK_NAME: week7-orders-prod
  TABLE_NAME: week7-orders-prod

jobs:

  # ---------------------------------------------------------------------------
  validate:
    name: Lint and validate template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: cfn-lint
        run: bash .github/scripts/lint-templates.sh

      - name: sam validate
        run: sam validate --template template.yaml --region "${{ vars.AWS_REGION }}"

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy prod stack
    needs: validate
    runs-on: ubuntu-latest
    environment: prod           # protected environment -> manual approval here
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Assume prod deployment role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-prod-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: SAM build
        run: bash .github/scripts/sam-build.sh

      # MODE=preview creates the change set with --no-execute-changeset and
      # folds it into the job summary, so the approver reads the diff there.
      - name: Preview change set (created, not executed)
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: prod
          MODE: preview
        run: bash .github/scripts/sam-deploy.sh

      - name: SAM deploy (prod)
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: prod
        run: bash .github/scripts/sam-deploy.sh

      # Same script the dev pipeline runs - one definition of "correct table",
      # so dev and prod can never drift apart on what they check.
      - name: Verify deployed table against the lab requirements
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT_LABEL: PROD
        run: bash .github/scripts/verify-table.sh
