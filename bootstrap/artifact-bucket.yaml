AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Bootstrap stack (1 of 2) - environment-scoped S3 bucket that stores SAM
  deployment artifacts for a single stage. Deploy this template ONCE per
  environment so that dev and prod never share an artifact bucket.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Description: The stage this artifact bucket belongs to.

  AppName:
    Type: String
    Default: week7-orders
    AllowedPattern: '^[a-z0-9][a-z0-9-]{2,32}$'

  ArtifactRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 3650
    Description: Days after which noncurrent artifact versions are expired.

Resources:

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Account id + region keep the name globally unique and self-documenting.
      BucketName: !Sub '${AppName}-sam-artifacts-${Environment}-${AWS::AccountId}-${AWS::Region}'

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true

      VersioningConfiguration:
        Status: Enabled

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifactVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: !Ref ArtifactRetentionDays
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

      Tags:
        - Key: Application
          Value: !Ref AppName
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: sam-deployment-artifacts

  # Deny anything that is not TLS and anything from outside this account.
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

          - Sid: AllowCloudFormationRead
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
            Resource: !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'

Outputs:
  ArtifactBucketName:
    Description: Pass this to `sam deploy --s3-bucket` for this environment.
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub '${AppName}-artifact-bucket-${Environment}'

  ArtifactBucketArn:
    Value: !GetAtt ArtifactBucket.Arn
    Export:
      Name: !Sub '${AppName}-artifact-bucket-arn-${Environment}'
